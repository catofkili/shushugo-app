<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- iOS WebView 优化 Meta 标签 -->
    <!-- ⚠️ 防双击缩放只靠这里的 user-scalable=no(WKWebView 认它,移动版 Safari 不认)。
         webview-optimizer 里那条「300ms 内的第二次 touchend 一律 preventDefault」已删:
         它不看是不是同一个元素,快速点两个不同按钮时会把第二下的 click 吃掉,
         而连着点评分正是答题的动作。别再加回来。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS 状态栏样式 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- 防止 iOS 自动识别电话号码 -->
    <meta name="format-detection" content="telephone=no" />

    <!-- 主题颜色 -->
    <meta name="theme-color" content="#FDF1DC" />

    <!-- 让 Dark Reader 这类「自动暗色」扩展别改这个页面。App 自己有深色主题；
         被扩展压暗的浅色主题会把奶油底变成红棕色（2026-09-23 作者自己的 Chrome 就这样，
         当时还以为是改版改坏了）。 -->
    <meta name="darkreader-lock" />

    <title>收集日</title>
    <link rel="icon" type="image/png" href="/brand/shushugo-icon.png" />
    <link rel="apple-touch-icon" href="/brand/shushugo-icon.png" />

    <style>
      /* 启动时防止闪屏 */
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #FDF1DC;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #FDF1DC;

        /* iOS WebView 性能优化 */
        -webkit-overflow-scrolling: touch;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        /* 防止双击缩放 */
        touch-action: pan-x pan-y;
      }

      #root {
        height: 100%;
        width: 100%;

        /* 硬件加速已移除 - 避免影响 position: fixed 定位 */
        /* transform: translateZ(0); */
        /* -webkit-transform: translateZ(0); */
      }

      /* 加载动画 */
      .loading-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #FFFBF2 0%, #FDF1DC 100%);
        color: #6B5A48;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- 加载提示（React 加载前显示） -->
    <div id="root">
      <div class="loading-splash">
        <div style="text-align: center;">
          <!-- 定妆总表「启动页 / 欢迎页插画」+「Logo 组合」，裁自 public/brand/sheet/ -->
          <img src="/brand/sheet/splash-sleep.png" alt="" style="display:block;height:120px;margin:0 auto" />
          <img src="/brand/sheet/logo-lockup.png" alt="收集日" style="display:block;height:80px;margin:4px auto 0" />
          <div style="font-size: 13px; opacity: 0.7; margin-top: 10px;">小小的积累，也会成为巨大的改变。</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
