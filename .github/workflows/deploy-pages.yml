name: Deploy ShuShuGo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SYNC_API_URL: https://api.shushugo.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 门禁写在这里而不是靠 CI:ci.yml 的 push 触发只有 main,往发布分支直推时
      # 它根本不跑,发布就成了「能 build 就能上」。三行重复换一个真的挡得住的闸门。
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # 线上公开网页不取音频包，一律系统朗读（作者 2026-10-13 定，见 audio-pack-platform.ts 的 PUBLIC_WEB_WITHOUT_PACKS），
      # 所以这里不下载 R2 / tar 音频制品，也不检查云存储可达性；音频包只给 App / 小程序 / 本机 dev。
      - name: Build Zoo Lab
        run: npx vite build --config zoo-lab/vite.config.ts --base=/shushugo-app/zoo/
      - name: Build app
        run: npm run build -- --base=/shushugo-app/
      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/zoo
          cp -R zoo-lab/dist/. dist/zoo/
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/release.json
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          echo "读音 / 例句：线上网页用系统朗读（首次打开提示一句）；音频包只给 App / 小程序 / 本机 dev。"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
